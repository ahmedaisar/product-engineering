name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install what the gate reads
        run: |
          python -m pip install pyyaml==6.0.3
          npm install -g @anthropic-ai/claude-code@2.1.311
      - name: Validate every plugin and skill
        env:
          VALIDATE_STRICT: "1"
        run: python -B tools/validate.py

      - name: Build ChatGPT plugin package
        run: |
          python chatgpt/build.py --output "$RUNNER_TEMP/product-engineering-dist"
          python -m json.tool "$RUNNER_TEMP/product-engineering-dist/product-engineering/plugin.json" > /dev/null
          test "$(find "$RUNNER_TEMP/product-engineering-dist/product-engineering/skills" -name SKILL.md | wc -l)" -eq 45
      - name: Test ChatGPT package builder
        run: python -m unittest discover -s chatgpt/tests -v
      - name: Test ChatGPT MCP service
        run: |
          python -m pip install -r chatgpt/mcp_server/requirements.txt
          python -m unittest discover -s chatgpt/mcp_server/tests -v
      - uses: actions/upload-artifact@v4
        with:
          name: product-engineering-chatgpt
          path: ${{ runner.temp }}/product-engineering-dist/product-engineering-chatgpt.zip
