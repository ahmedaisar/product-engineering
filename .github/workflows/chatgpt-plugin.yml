name: ChatGPT plugin package

on:
  pull_request:
    paths:
      - "chatgpt/**"
      - ".github/workflows/chatgpt-plugin.yml"
      - "product/skills/**"
      - "ai-shipping/skills/**"
      - "agent-teams/skills/**"
      - "agent-harness/skills/**"
      - "app-stack/skills/**"
      - "work-humanizer/skills/**"
  push:
    branches: [main]
    paths:
      - "chatgpt/**"
      - ".github/workflows/chatgpt-plugin.yml"
      - "product/skills/**"
      - "ai-shipping/skills/**"
      - "agent-teams/skills/**"
      - "agent-harness/skills/**"
      - "app-stack/skills/**"
      - "work-humanizer/skills/**"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate portable package build
        run: |
          python chatgpt/build.py --output "$RUNNER_TEMP/product-engineering-dist"
          python -m json.tool "$RUNNER_TEMP/product-engineering-dist/product-engineering/plugin.json" > /dev/null
          test "$(find "$RUNNER_TEMP/product-engineering-dist/product-engineering/skills" -name SKILL.md | wc -l)" -eq 45
      - name: Test MCP service
        run: |
          python -m pip install -r chatgpt/mcp_server/requirements.txt
          python -m unittest discover -s chatgpt/mcp_server/tests -v
