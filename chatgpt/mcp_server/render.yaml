services:
  - type: web
    name: product-engineering-skills-mcp
    runtime: docker
    dockerfilePath: ./chatgpt/mcp_server/Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: GITHUB_REPOSITORY
        value: ahmedaisar/product-engineering
      - key: GITHUB_REF
        value: main
      - key: CACHE_SECONDS
        value: "300"
